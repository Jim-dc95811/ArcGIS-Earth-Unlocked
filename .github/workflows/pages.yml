# Publishes the front door site (site/index.html + the montage) to GitHub Pages
# at https://jim-dc95811.github.io/ArcGIS-Earth-Unlocked/ on every push to main
# that touches site/ or images/. One-time setup by Jim: Settings > Pages >
# Source: GitHub Actions.
name: Publish front door site
on:
  push:
    branches: [main]
    paths: ["site/**", "images/seven_projects_montage.jpg", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/images
          cp site/index.html _site/
          cp images/seven_projects_montage.jpg _site/images/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
